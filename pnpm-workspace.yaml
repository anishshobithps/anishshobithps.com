allowBuilds:
  '@clerk/shared': true
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: true
overrides:
  # drizzle-kit declares the deprecated @esbuild-kit/esm-loader but its code uses tsx;
  # alias it to tsx to drop the dead chain. Remove once drizzle-kit drops the dep.
  '@esbuild-kit/esm-loader': 'npm:tsx@^4'
  # next pins postcss exactly (8.4.31), even on latest; remove when next ships >=8.5.10.
  postcss@<8.5.10: ^8.5.10
