name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci-placeholder
      CLERK_SECRET_KEY: sk_test_ci_secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_publishable
      CLERK_WEBHOOK_SECRET: whsec_ci_webhook
      OWNER_CLERK_USER_ID: user_ci_owner
      IP_HASH_SALT: ci_ip_hash_salt
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:ws

      - run: pnpm turbo run types:check test
