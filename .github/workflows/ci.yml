name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci-placeholder
      CLERK_SECRET_KEY: ci-placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ci-placeholder
      CLERK_WEBHOOK_SECRET: ci-placeholder
      OWNER_CLERK_USER_ID: ci-placeholder
      IP_HASH_SALT: ci-placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:ws

      - run: pnpm turbo run types:check test
